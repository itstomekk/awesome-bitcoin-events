name: Check list and deploy website

# README.md (upcoming) and PAST.md (archive) are the source of truth. This workflow:
#   - on every pull request: validates the list, runs tests, lints the README as an
#     awesome list and builds the site (a PR with a malformed event line goes red);
#   - on push to main (or a manual run): does the same, then publishes the site to
#     https://itstomekk.github.io/awesome-bitcoin-events/
# Upcoming vs past is decided in the visitor's browser, so no scheduled rebuild is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Errors point at README.md:<line> with a plain-English fix.
      - name: Validate event list
        run: npm run check
      - name: Run tests
        run: npm test
      # Official awesome-list linter (badge, contents, list item style). Only README
      # content rules fail the build. Its awesome-github rule checks repo settings (the
      # "awesome" topic, licence detection), so it is reported as a warning instead.
      - name: Lint README as an awesome list
        run: |
          npx --yes awesome-lint README.md > lint.txt 2>&1 || true
          cat lint.txt
          if grep -E '✖ +[0-9]+:[0-9]+ .*remark-lint:' lint.txt | grep -v 'remark-lint:awesome-github' | grep -q .; then exit 1; fi
          if grep -q 'remark-lint:awesome-github' lint.txt; then echo "::warning::awesome-lint GitHub-settings check failed (add the 'awesome' topic in repo settings). Not blocking."; fi
      - name: Build website
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /awesome-bitcoin-events
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
