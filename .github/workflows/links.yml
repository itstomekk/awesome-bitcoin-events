name: Check event links

# Weekly check that the official links in README.md still work. It never blocks a PR;
# if links are broken it opens (or updates) an issue listing them.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,201,202,203,204,206,301,302,303,307,308,403,429 README.md
          fail: false
      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken event links
          content-filepath: ./lychee/out.md
          labels: broken-links
